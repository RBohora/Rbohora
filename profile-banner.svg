<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Raghav Bohora — Backend Engineering, Geospatial Systems and Applied AI</title>
  <desc id="desc">A dark navy technology-inspired banner with blue geometric paths and a monogram RB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c31"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#94a3b8" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".50">
    <path d="M760 0 L880 100 L1010 100 L1110 195 L1200 195"/>
    <path d="M820 300 L930 210 L1040 210 L1130 120 L1200 120"/>
    <path d="M960 0 L1040 70 L1140 70 L1200 20" stroke-opacity=".32"/>
  </g>
  <g fill="#7dd3fc" fill-opacity=".85">
    <circle cx="880" cy="100" r="4"/><circle cx="1010" cy="100" r="4"/><circle cx="1110" cy="195" r="4"/>
    <circle cx="930" cy="210" r="4"/><circle cx="1040" cy="210" r="4"/><circle cx="1130" cy="120" r="4"/>
  </g>
  <rect x="72" y="62" width="5" height="174" rx="2.5" fill="url(#accent)"/>
  <text x="102" y="91" fill="#93c5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="3">COMPUTER SCIENCE  /  VIT-AP</text>
  <text x="100" y="158" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="51" font-weight="750" letter-spacing="-1.5">Raghav Bohora</text>
  <text x="103" y="199" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500">Backend Engineering  ·  Geospatial Systems  ·  Applied AI</text>
  <text x="103" y="235" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="1.3">BUILDING PRACTICAL SOFTWARE, ONE PROJECT AT A TIME</text>
  <circle cx="1082" cy="150" r="77" fill="#0b1220" stroke="url(#accent)" stroke-width="2" stroke-opacity=".85"/>
  <circle cx="1082" cy="150" r="66" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-dasharray="4 8"/>
  <text x="1082" y="166" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-3">RB</text>
</svg>
